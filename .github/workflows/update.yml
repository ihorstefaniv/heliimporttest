name: Update XML Feed

on:
  schedule:
    - cron: '0 * * * *' # Оновлюється автоматично кожну годину
  workflow_dispatch: # Дозволяє запустити оновлення вручну однією кнопкою

# Лише один запуск одночасно — інакше два запуски пушать feed.xml і конфліктують
concurrency:
  group: update-xml-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download XML from Google Apps Script
        run: |
          curl -sSL --fail --retry 3 --retry-delay 10 \
            "https://script.google.com/macros/s/AKfycbz2D-EDkR9sy6Tl-EOKnbvxC5RFmlj6M9j_JK2VX4iTTnBUsKJQ-SjyLuJh1w65nx1N/exec" \
            -o /tmp/feed.new.xml

      - name: Validate XML
        run: |
          sudo apt-get install -y -qq libxml2-utils > /dev/null
          # 1) це справжній XML, а не HTML-сторінка логіну чи помилки Google
          xmllint --noout /tmp/feed.new.xml
          # 2) є обов'язкові вузли YML
          grep -q "<categories>" /tmp/feed.new.xml
          grep -q "<currencies>" /tmp/feed.new.xml
          # 3) офферів не підозріло мало (захист від порожнього фіду)
          OFFERS=$(grep -c "<offer " /tmp/feed.new.xml || true)
          echo "Offers: $OFFERS"
          if [ "$OFFERS" -lt 10 ]; then
            echo "Підозріло мало офферів ($OFFERS) — старий feed.xml залишається без змін"
            exit 1
          fi

      - name: Commit and push if it changed
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"

          # feed.xml повністю генерується, тому його ніколи не зливаємо (merge/rebase):
          # беремо свіжий main і кладемо нову версію поверх. Повтор на випадок гонки.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/feed.new.xml feed.xml
            git add feed.xml
            if git diff --staged --quiet; then
              echo "Фід не змінився — комітити нічого"
              exit 0
            fi
            git commit -m "Auto-update XML feed"
            if git push origin HEAD:main; then
              echo "Запушено (спроба $attempt)"
              exit 0
            fi
            echo "Push не вдався, повтор через 10 с..."
            sleep 10
          done
          echo "Не вдалося запушити після 3 спроб"
          exit 1
