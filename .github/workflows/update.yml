name: Update XML Feed

on:
  schedule:
    - cron: '0 * * * *' # Оновлюється автоматично кожну годину
  workflow_dispatch: # Дозволяє запустити оновлення вручну однією кнопкою

# Лише один запуск одночасно — інакше два запуски пушать feed.xml і конфліктують
concurrency:
  group: update-xml-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download XML from Google Apps Script
        run: |
          curl -sSL --fail --retry 3 --retry-delay 10 \
            "https://script.google.com/macros/s/AKfycbz2D-EDkR9sy6Tl-EOKnbvxC5RFmlj6M9j_JK2VX4iTTnBUsKJQ-SjyLuJh1w65nx1N/exec" \
            -o /tmp/feed.new.xml

      - name: Validate XML
        run: |
          # Перевірка через Python (є на runner'і за замовчуванням, нічого не встановлюємо).
          # Приймає будь-який формат (yml_catalog, products, ...), відсіює лише зламаний/порожній фід.
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "/tmp/feed.new.xml"
          raw = open(path, encoding="utf-8", errors="replace").read()
          try:
              root = ET.fromstring(raw.encode("utf-8"))
          except ET.ParseError as e:
              # Не XML: найчастіше HTML-сторінка логіну або помилки Google
              print("::error::Файл не є валідним XML:", e)
              print(raw[:500])
              sys.exit(1)

          print("Кореневий тег:", root.tag)

          if root.tag == "yml_catalog":
              items = root.findall("shop/offers/offer")
              for tag in ("categories", "currencies"):
                  if root.find("shop/" + tag) is None:
                      print("::warning::Немає вузла <%s> (імпортер може впасти)" % tag)
          else:
              # Інший формат, напр. <products><product>...</product></products>:
              # товари — це найчисленніші дочірні елементи кореня
              children = list(root)
              if children:
                  counts = {}
                  for c in children:
                      counts[c.tag] = counts.get(c.tag, 0) + 1
                  item_tag = max(counts, key=counts.get)
                  items = [c for c in children if c.tag == item_tag]
                  print("Елемент товару:", item_tag)
              else:
                  items = []

          print("Items:", len(items))
          if len(items) < 10:
              print("::error::Підозріло мало товарів (%d) — старий feed.xml залишається без змін" % len(items))
              print(raw[:500])
              sys.exit(1)
          PY

      - name: Normalize XML (усі теги в кожному товарі)
        run: |
          # Імпортер biz24 падає з "Cannot read properties of undefined (reading 'toString')",
          # якщо в якомусь товарі немає тегу. Тут кожен товар доповнюється ВСІМА тегами
          # (порожніми, якщо значення немає) і довгі тексти обрізаються до 255 символів.
          # Працює незалежно від того, яка версія doGet розгорнута в Apps Script.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          MAX_LEN = 255
          path = "/tmp/feed.new.xml"
          root = ET.parse(path).getroot()

          if root.tag != "products":
              print("Формат не <products> — нормалізацію пропущено")
              raise SystemExit(0)

          products = [p for p in root if p.tag == "product"]

          # Повний список тегів у порядку першої появи
          tags = []
          for p in products:
              for ch in p:
                  if ch.tag not in tags:
                      tags.append(ch.tag)

          def clean(v):
              v = (v or "").strip()
              if v.strip("/-. ") == "":
                  return ""
              if len(v) > MAX_LEN:
                  cut = v[:MAX_LEN - 1]
                  if ", " in cut:
                      cut = cut[:cut.rfind(", ")]
                  v = cut + "…"
              return v

          added = 0
          out = ['<?xml version="1.0" encoding="UTF-8"?>', "<products>"]
          for p in products:
              vals = {ch.tag: ch.text for ch in p}
              out.append("  <product>")
              for t in tags:
                  if t not in vals:
                      added += 1
                  out.append("    <%s>%s</%s>" % (t, escape(clean(vals.get(t))), t))
              out.append("  </product>")
          out.append("</products>")

          open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          print("Товарів: %d · тегів у кожному: %d · дописано порожніх тегів: %d" % (len(products), len(tags), added))
          PY

      - name: Commit and push if it changed
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"

          # feed.xml повністю генерується, тому його ніколи не зливаємо (merge/rebase):
          # беремо свіжий main і кладемо нову версію поверх. Повтор на випадок гонки.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/feed.new.xml feed.xml
            git add feed.xml
            if git diff --staged --quiet; then
              echo "Фід не змінився — комітити нічого"
              exit 0
            fi
            git commit -m "Auto-update XML feed"
            if git push origin HEAD:main; then
              echo "Запушено (спроба $attempt)"
              exit 0
            fi
            echo "Push не вдався, повтор через 10 с..."
            sleep 10
          done
          echo "Не вдалося запушити після 3 спроб"
          exit 1
