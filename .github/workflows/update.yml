// ==========================================
// НАЛАШТУВАННЯ ТА КОНСТАНТИ
// ==========================================
var CONFIG = {
  SOURCE_ID: "1g5OWic0CgHX2pa-EHKlXmuREtSyk0Njj_iDMuqv9zkQ",
  SOURCE_SHEET: "Stock list",
  TARGET_ID: "17RD9FHyXPmOM8rphxY4Tm-NX__59AXLpWhuTYK2bQvA",
  RAW_SHEET: "Price",
  EXPORT_SHEET: "export",
  PHOTO_SHEET: "photo",

  // Домен для відносних посилань з вкладки photo (колонка Link: /image/1163009/...).
  // Якщо в колонці Domain на вкладці photo щось вписано — буде використано його.
  PHOTO_DOMAIN: "https://ВАШ-ДОМЕН.com",   // <-- ОБОВ'ЯЗКОВО ЗАМІНИТИ

  // Дані магазину для XML (YML)
  SHOP_NAME: "HELI",
  SHOP_URL: "https://ВАШ-ДОМЕН.com",       // <-- ЗАМІНИТИ
  TIMEZONE: "Europe/Kyiv",

  // Години автоматичного оновлення (за часовим поясом проєкту Apps Script)
  UPDATE_HOURS: [7, 15],

  // Мінімальний бал схожості, щоб прикріпити фото (чим більше — тим суворіше)
  PHOTO_MIN_SCORE: 45,

  // ШІ-підбір фото для моделей, яким правила нічого не знайшли (необов'язково).
  // Ключ зберігається у Властивостях скрипту: ANTHROPIC_API_KEY
  USE_AI_PHOTO_MATCH: false,
  AI_MODEL: "claude-haiku-4-5-20251001",
  AI_CACHE_SHEET: "ai_photo_cache"
};

// Колонки експорту: перші 24 — як і раніше (порядок не змінено), нові — в кінці
var SYSTEM_HEADERS = [
  "SKU", "Brand", "Full_Model", "Base_Model", "Category_Type",
  "Capacity_kg", "Tonnage", "Price", "Currency", "Is_Available",
  "Qty", "Controller_Engine", "Engine_Type", "Battery_Type",
  "Voltage", "Battery_Capacity", "Forks_Dimensions", "MAST",
  "Tyres", "Special_Options", "Location", "ETA", "Serial_Number", "Image_URL",
  "Series", "Attachments", "Cabin", "Photo_Match", "Photo_Name", "Photo_Link"
];

// ==========================================
// 1. ГОЛОВНА ФУНКЦІЯ ОНОВЛЕННЯ ТА ЕКСПОРТУ
// ==========================================
function updateSyncAndNormalize() {
  // Захист від двох одночасних запусків (тригер + ручний запуск)
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(30000)) { Logger.log("Інший запуск ще триває — пропускаю."); return; }
  try {
    runUpdate_();
  } finally {
    lock.releaseLock();
  }
}

function runUpdate_() {
  var sourceSS = SpreadsheetApp.openById(CONFIG.SOURCE_ID);
  var sourceSheet = sourceSS.getSheetByName(CONFIG.SOURCE_SHEET);
  var sourceRange = sourceSheet.getDataRange();
  if (sourceRange.getNumRows() <= 1) return;

  var targetSS = SpreadsheetApp.openById(CONFIG.TARGET_ID);
  var rawTargetSheet = targetSS.getSheetByName(CONFIG.RAW_SHEET) || targetSS.insertSheet(CONFIG.RAW_SHEET);

  // Повне очищення (раніше чистився лише діапазон нового розміру — старі рядки лишались)
  rawTargetSheet.clear();

  // Скопіювати дані разом зі стилями
  var numRows = sourceRange.getNumRows();
  var numCols = sourceRange.getNumColumns();
  var destinationRange = rawTargetSheet.getRange(1, 1, numRows, numCols);
  var tempSheet = sourceSheet.copyTo(targetSS);
  tempSheet.getDataRange().copyTo(destinationRange);
  targetSS.deleteSheet(tempSheet);

  // Фото
  var photoSheet = targetSS.getSheetByName(CONFIG.PHOTO_SHEET);
  var photoData = photoSheet ? photoSheet.getDataRange().getValues() : [];
  var photoIndex = buildPhotoIndex_(photoData);

  // Нормалізація
  var rawData = sourceRange.getValues();
  var rows = normalizeData_(rawData, photoIndex);

  // ШІ для рядків без фото (якщо ввімкнено)
  if (CONFIG.USE_AI_PHOTO_MATCH) {
    applyAiPhotoMatches_(targetSS, rows, photoIndex);
  }

  // Запис у export
  var normalizedRows = [SYSTEM_HEADERS].concat(rows.map(function (obj) {
    return SYSTEM_HEADERS.map(function (h) { return obj[h] !== undefined ? obj[h] : ""; });
  }));

  // Запис БЕЗ попереднього повного очищення: нові дані лягають поверх старих,
  // потім прибираються зайві рядки. Так фід (doGet) ніколи не бачить порожню вкладку.
  var exportSheet = targetSS.getSheetByName(CONFIG.EXPORT_SHEET) || targetSS.insertSheet(CONFIG.EXPORT_SHEET);
  var numOut = normalizedRows.length;
  if (exportSheet.getMaxColumns() < SYSTEM_HEADERS.length) {
    exportSheet.insertColumnsAfter(exportSheet.getMaxColumns(), SYSTEM_HEADERS.length - exportSheet.getMaxColumns());
  }
  var outRange = exportSheet.getRange(1, 1, numOut, SYSTEM_HEADERS.length);
  outRange.setNumberFormat("@"); // текстовий формат: зберігає нулі на початку серійників
  outRange.setValues(normalizedRows);

  var lastRow = exportSheet.getLastRow();
  if (lastRow > numOut) {
    exportSheet.getRange(numOut + 1, 1, lastRow - numOut, exportSheet.getMaxColumns()).clearContent();
  }
  SpreadsheetApp.flush();

  exportSheet.getRange(1, 1, 1, SYSTEM_HEADERS.length).setFontWeight("bold").setBackground("#e8f0fe");
  var maxCols = exportSheet.getMaxColumns();
  if (maxCols > SYSTEM_HEADERS.length) {
    exportSheet.deleteColumns(SYSTEM_HEADERS.length + 1, maxCols - SYSTEM_HEADERS.length);
  }

  // Час останнього оновлення — для атрибута date у фіді.
  // Так фід змінюється лише після реального оновлення, а не при кожному зверненні.
  PropertiesService.getScriptProperties().setProperty(
    "LAST_UPDATE", Utilities.formatDate(new Date(), CONFIG.TIMEZONE, "yyyy-MM-dd HH:mm"));

  var withPhoto = rows.filter(function (r) { return r["Image_URL"]; }).length;
  Logger.log("Дані успішно оброблені! Рядків: " + rows.length + ", з фото: " + withPhoto);
}

// ==========================================
// 2. НОРМАЛІЗАЦІЯ (чиста функція — без звернень до таблиць)
// ==========================================
function normalizeData_(rawData, photoIndex) {
  // Пошук рядка заголовків
  var headerRowIdx = -1;
  for (var i = 0; i < Math.min(rawData.length, 10); i++) {
    for (var j = 0; j < rawData[i].length; j++) {
      var cellVal = String(rawData[i][j]).trim().toUpperCase();
      if (cellVal.indexOf("MODEL") !== -1 || cellVal.indexOf("REFERENCE") !== -1) { headerRowIdx = i; break; }
    }
    if (headerRowIdx !== -1) break;
  }
  if (headerRowIdx === -1) headerRowIdx = 0;

  var rawHeaders = rawData[headerRowIdx].map(function (h) {
    return String(h).replace(/\s+/g, " ").trim().toUpperCase(); // "EXW GROSS\nPRICE" -> "EXW GROSS PRICE"
  });

  function getColIndex(name) {
    for (var k = 0; k < rawHeaders.length; k++) {
      if (rawHeaders[k].indexOf(name.toUpperCase()) !== -1) return k;
    }
    return -1;
  }
  function firstCol() {
    for (var a = 0; a < arguments.length; a++) {
      var idx = getColIndex(arguments[a]);
      if (idx !== -1) return idx;
    }
    return -1;
  }

  var idx = {
    ref: getColIndex("REFERENCE"),
    model: getColIndex("MODEL"),
    type: getColIndex("TYPE"),
    series: getColIndex("SERIES"),
    price: firstCol("EXW GROSS", "PRICE"),
    qty: getColIndex("QTY"),
    engine: firstCol("ENGINE", "CONTROLLER"),
    mast: getColIndex("MAST"),
    tyres: getColIndex("TYRES"),
    attach: getColIndex("ATTACHMENT"),
    cabin: getColIndex("CABIN"),
    special: getColIndex("SPECIAL"),
    desc: getColIndex("DESCRIPTION"),
    location: getColIndex("LOCATION"),
    eta: getColIndex("ETA"),
    available: getColIndex("AVAILABLE"),   // у прайсі тут серійні номери наявних машин
    demoSerial: firstCol("DEMO S/N", "SERIAL"),
    image: getColIndex("IMAGE")
  };

  function cell(row, i) { return i === -1 ? "" : cleanCell_(row[i]); }
  function raw(row, i) { return i === -1 ? "" : row[i]; }

  var photoCache = {};
  var result = [];

  for (var r = headerRowIdx + 1; r < rawData.length; r++) {
    var row = rawData[r];
    var rawModel = cell(row, idx.model);
    if (isEmptyMark_(rawModel) || rawModel.toUpperCase() === "MODEL") continue;

    var rawRef = cell(row, idx.ref);
    var rawType = cell(row, idx.type);
    var rawSeries = cell(row, idx.series);
    var rawEngine = cell(row, idx.engine);
    var rawMast = emptyIfMark_(cell(row, idx.mast));
    var rawTyres = emptyIfMark_(cell(row, idx.tyres));
    var rawAttach = emptyIfMark_(cell(row, idx.attach));
    var rawCabin = emptyIfMark_(cell(row, idx.cabin));
    var rawDesc = idx.desc === -1 ? "" : String(raw(row, idx.desc) || "");
    var rawLocation = cell(row, idx.location);
    var rawEta = cell(row, idx.eta);
    var rawImage = cell(row, idx.image);
    var specialList = splitList_(raw(row, idx.special));
    var serials = uniq_(splitList_(raw(row, idx.available)).concat(splitList_(raw(row, idx.demoSerial))));
    var rawSerial = serials.join(", ");

    // 1. Qty (числа, "2 / 5", а також чекбокси true/false)
    var qtyCell = raw(row, idx.qty);
    var cleanQty = parseQty_(qtyCell);

    // 2. Базова модель
    var baseModel = rawModel.split("-")[0].trim();

    // 3. Вантажопідйомність
    var capKg = "", tonnage = "";
    var modelCapMatch = rawModel.match(/^[A-Z]+(\d{2,3})/i);
    if (modelCapMatch) {
      var kg = parseInt(modelCapMatch[1], 10) * 100;
      capKg = kg + " kg";
      tonnage = (kg / 1000).toFixed(1) + " t";
    }

    // 4. Наявність (стара логіка + серійники з колонки AVAILABLE + чекбокс Qty)
    var checkAvail = (rawEta + " " + rawSerial + " " + rawLocation).toUpperCase();
    var isAvailable = checkAvail.indexOf("DELIVERED") !== -1 ||
                      checkAvail.indexOf("AVAILABLE") !== -1 ||
                      rawSerial.length > 3 ||
                      qtyCell === true;

    // 5. Тип двигуна
    var engText = (rawType + " " + rawEngine).toUpperCase();
    var engineType = "Electric";
    if (/\bLPG\b|\bGAS\b/.test(engText) || /^CPYD/i.test(rawModel)) {
      engineType = "LPG";
    } else if (/DIESEL|KUBOTA|YUCHAI|XINCHAI|YANMAR|CUMMINS|PERKINS|DEUTZ/.test(engText) || /^CPCD/i.test(rawModel)) {
      engineType = "Diesel";
    }

    // 6. Акумулятор
    var battText = (rawModel + " " + rawType + " " + specialList.join(" ") + " " + rawDesc).toUpperCase();
    var regVoltage = "", regBatteryCapacity = "", regBatteryType = "";
    if (engineType === "Electric") {
      var vAh = battText.match(/(\d{2,3}(?:\.\d{1,2})?)\s*V\s*[\/\-]?\s*(\d{2,4})\s*AH\b/);
      if (vAh) {
        regVoltage = vAh[1] + "V";
        regBatteryCapacity = vAh[2] + "Ah";
      } else {
        var vOnly = battText.match(/(\d{2,3}(?:\.\d{1,2})?)\s*V\b(?!\s*[-\/]?\s*\d+\s*A\b)/);
        if (vOnly) regVoltage = vOnly[1] + "V";
        var ahOnly = battText.match(/(\d{2,4})\s*AH\b/);
        if (ahOnly) regBatteryCapacity = ahOnly[1] + "Ah";
      }

      if (/LITHI?UM|LITHUM|LI-?ION|\bLI BATTERY/.test(battText)) {
        regBatteryType = "Lithium-ion";
      } else if (/LEAD|ACID|BLEI/.test(battText)) {
        regBatteryType = "Lead-acid";
      } else if (/WARTUNGSFREI|MAINTENANCE[\s-]*FREE/.test(battText)) {
        regBatteryType = "Maintenance-free";
      } else if (/-.*LI/i.test(rawModel)) {
        regBatteryType = "Lithium-ion"; // суфікс моделі: -LI3, -A2LIH, -GB2LI ...
      }
    }

    // 7. Шини
    var fullTextSearch = (rawModel + " " + rawType + " " + specialList.join(" ") + " " + rawDesc).toUpperCase();
    var finalTyres = normalizeTyres_(rawTyres, fullTextSearch);

    // 8. Вила та спец-опції з опису
    var forksDim = extractForks_(rawDesc);
    var descOptions = extractSpecialOptions_(rawDesc);
    var combinedSpecial = uniqCI_(specialList.concat(descOptions)).join(", ");

    // 9. Фото
    var photoKey = rawModel + "|" + rawSeries + "|" + rawType;
    if (!photoCache[photoKey]) {
      photoCache[photoKey] = findMatchingPhoto_(photoIndex, rawModel, baseModel, rawType, rawSeries, tonnage);
    }
    var photo = photoCache[photoKey];

    var obj = {};
    obj["SKU"] = rawRef;
    obj["Brand"] = "HELI";
    obj["Full_Model"] = rawModel;
    obj["Base_Model"] = baseModel;
    obj["Category_Type"] = rawType;
    obj["Capacity_kg"] = capKg;
    obj["Tonnage"] = tonnage;
    obj["Price"] = parsePrice_(raw(row, idx.price));
    obj["Currency"] = "EUR";
    obj["Is_Available"] = isAvailable ? "true" : "false";
    obj["Qty"] = cleanQty;
    obj["Controller_Engine"] = rawEngine;
    obj["Engine_Type"] = engineType;
    obj["Battery_Type"] = regBatteryType;
    obj["Voltage"] = regVoltage;
    obj["Battery_Capacity"] = regBatteryCapacity;
    obj["Forks_Dimensions"] = forksDim;
    obj["MAST"] = rawMast;
    obj["Tyres"] = finalTyres;
    obj["Special_Options"] = combinedSpecial;
    obj["Location"] = rawLocation;
    obj["ETA"] = rawEta;
    obj["Serial_Number"] = rawSerial;
    obj["Image_URL"] = photo.url || rawImage;
    obj["Series"] = emptyIfMark_(rawSeries);
    obj["Attachments"] = rawAttach;
    obj["Cabin"] = rawCabin;
    obj["Photo_Match"] = photo.url ? (photo.method + " " + photo.score + ": " + photo.name) : "";
    obj["Photo_Name"] = photo.name || "";   // ім'я файлу: CBD15-20-A-BLIH.webp
    obj["Photo_Link"] = photo.link || "";   // лінк з вкладки photo як є: /image/1162995/CBD15-20-A-BLIH.webp
    result.push(obj);
  }
  return result;
}

// ==========================================
// 3. ДОПОМІЖНІ ФУНКЦІЇ ОЧИЩЕННЯ
// ==========================================
function cleanCell_(v) {
  if (v === null || v === undefined) return "";
  if (Object.prototype.toString.call(v) === "[object Date]") {
    return Utilities.formatDate(v, CONFIG.TIMEZONE, "dd.MM.yyyy");
  }
  return String(v).replace(/[\r\n\t]+/g, " ").replace(/\s{2,}/g, " ").trim();
}

function isEmptyMark_(s) {
  return !s || /^[\/\-\s.]*$/.test(String(s));
}

function emptyIfMark_(s) {
  return isEmptyMark_(s) ? "" : s;
}

// Клітинка з кількома значеннями через перенос рядка -> масив
function splitList_(v) {
  if (v === null || v === undefined || v === "") return [];
  return String(v).split(/[\r\n]+/).map(function (s) { return s.trim(); })
    .filter(function (s) { return !isEmptyMark_(s); });
}

function uniq_(arr) {
  var seen = {};
  return arr.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
}

function uniqCI_(arr) {
  var seen = {};
  return arr.filter(function (x) {
    var k = x.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!k || seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

function parseQty_(v) {
  if (v === true) return "1";
  if (v === false) return "0";
  if (v === null || v === undefined || String(v).trim() === "") return "1"; // як і раніше: порожньо = 1
  if (typeof v === "number") return String(Math.round(v));
  var m = String(v).split("/")[0].match(/\d+/);
  return m ? m[0] : "1";
}

function parsePrice_(v) {
  if (typeof v === "number") return v.toFixed(2);
  var s = String(v || "").replace(/[^0-9.]/g, "");
  var n = parseFloat(s);
  return isNaN(n) ? "" : n.toFixed(2);
}

function normalizeTyres_(rawTyres, fullText) {
  var nonMarkRe = /\bNON?[\s-]*(MARKING|MAKRING|MARKIN)\b/i;
  var t = rawTyres || "";
  t = t.replace(nonMarkRe, "Non-marking").replace(/\btires?\b|\btyre\b/gi, "Tyres");

  var textHasNonMark = nonMarkRe.test(fullText) || fullText.indexOf("WEISS") !== -1 || fullText.indexOf("WHITE") !== -1;
  if (textHasNonMark && t.toUpperCase().indexOf("NON-MARKING") === -1) {
    t = t ? t + " (Non-marking)" : "Non-marking";
  }
  return t;
}

var FORKS_RE = /(\d{3,4})\s*[x×*х]\s*(\d{3,4})\s*(?:mm|мм)?|(\d{3,4})\s*(?:mm|мм)(?![a-z])/i;

function extractForks_(text) {
  if (!text) return "";
  var m = String(text).match(FORKS_RE);
  if (!m) return "";
  return m[1] ? (m[1] + "x" + m[2] + " mm") : (m[3] + " mm");
}

// Опис розбивається на сегменти; вила й акумулятор відкидаються (вони в окремих колонках)
function extractSpecialOptions_(text) {
  if (!text || isEmptyMark_(text)) return [];
  var t = String(text)
    .replace(/(\d(?:\.\d+)?\s*[A-Za-z]{0,3})\s*\/\s*(?=\d)/g, "$1 "); // 24V/40Ah -> 24V 40Ah
  var parts = t.split(/[\/,;\r\n]+/);
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    var seg = parts[i].replace(/\s+/g, " ").replace(/^[\s\-–.:]+|[\s\-–.:]+$/g, "");
    if (seg.length < 2) continue;
    var up = seg.toUpperCase();

    // вила
    if (FORKS_RE.test(seg)) {
      var rest = seg.replace(new RegExp(FORKS_RE.source, "gi"), "").replace(/\bFORKS?\b/gi, "").trim();
      if (rest.length <= 2) continue;
      seg = rest; up = seg.toUpperCase();
    }
    // акумулятор / напруга
    if (/\d+\s*AH\b/.test(up)) continue;
    if (/^\d+(\.\d+)?\s*V$/.test(up)) continue;
    if (/LITHI?UM|LITHUM|LI-?ION|\bLI\b|LEAD|ACID|MAINTENANCE[\s-]*FREE|BATTERY/.test(up) &&
        !/CHARGER|CLOUD|INDICATOR/.test(up)) continue;

    out.push(seg);
  }
  return out;
}

// ==========================================
// 4. ФОТО: ІНДЕКС ТА ПІДБІР
// ==========================================
function buildPhotoIndex_(photoData) {
  var list = [];
  if (!photoData || photoData.length <= 1) return list;

  var h = photoData[0].map(function (x) { return String(x).trim().toUpperCase(); });
  function col(name, def) { var i = h.indexOf(name); return i === -1 ? def : i; }
  var iFolder = col("FOLDER", 0), iName = col("NAME", 1), iModel = col("MODEL", 2),
      iDomain = col("DOMAIN", 3), iLink = col("LINK", 4);

  for (var p = 1; p < photoData.length; p++) {
    var row = photoData[p];
    var name = String(row[iName] || "").replace(/[\r\n]+/g, "").trim();
    if (!name || name.indexOf("папка") !== -1) continue;

    var base = name.replace(/\.(webp|jpg|jpeg|png)$/i, "");
    var link = String(row[iLink] || "").trim();
    var domain = String(row[iDomain] || "").trim() || CONFIG.PHOTO_DOMAIN;

    list.push({
      name: name,
      link: link,
      url: buildPhotoUrl_(link, domain, name),
      folder: String(row[iFolder] || "").toUpperCase(),
      clean: base.toUpperCase().replace(/[^A-Z0-9]/g, ""),
      manualModels: String(row[iModel] || "").toUpperCase().split(/[,;\n]+/)
        .map(function (s) { return s.replace(/[^A-Z0-9]/g, ""); }).filter(Boolean),
      families: parsePhotoFamilies_(base),
      series: parsePhotoSeries_(base),
      plus: base.indexOf("+") !== -1,
      tonRange: parseTonRange_(base),
      isIC: /(^|[_\s])IC([_\s]|$)/i.test(base),
      isRough: /ROUGH/i.test(base)
    });
  }
  return list;
}

function buildPhotoUrl_(link, domain, name) {
  if (/^https?:\/\//i.test(link)) return link;
  if (link) {
    if (!domain || domain.indexOf("ВАШ-ДОМЕН") !== -1) return link; // відносне — домен не задано
    return domain.replace(/\/+$/, "") + (link.charAt(0) === "/" ? link : "/" + link);
  }
  return name; // як раніше: лише ім'я файлу
}

// Витягує "сімейства" моделей з імені файлу:
// CBD15-18-20J-LI3 -> {CBD, [15,18,20], JLI3}; CPCD10-CPCD35 -> {CPCD, [10,35], діапазон}
function parsePhotoFamilies_(base) {
  var s = base.toUpperCase().replace(/\s+/g, " ");
  var fams = [];

  var rangeRe = /([A-Z]{2,4})(\d{2,3})\s*-\s*\1(\d{2,3})/g;
  s = s.replace(rangeRe, function (m, p, a, b) {
    fams.push({ prefix: p, caps: [+a, +b], suffix: "" });
    return " ";
  });

  s = s.replace(/(\d{2,3})[A-Z](?=[-_]\d{2,3})/g, "$1"); // CBD15J-18J-20J -> CBD15-18-20J

  var re = /([A-Z]{2,4}) ?(\d{2,3})((?:[-_]\d{2,3})*)([A-Z0-9-]*)/g;
  var m;
  while ((m = re.exec(s)) !== null) {
    var before = m.index > 0 ? s.charAt(m.index - 1) : "";
    if (/[A-Z]/.test(before)) continue;
    var nums = [m[2]].concat(m[3].split(/[-_]/).filter(Boolean));
    var caps = [], extra = "";
    nums.forEach(function (n) { if (+n < 300) caps.push(+n); else extra += n; });
    fams.push({ prefix: m[1], caps: caps, suffix: (extra + m[4]).replace(/[^A-Z0-9]/g, "") });
  }
  return fams;
}

function parsePhotoSeries_(base) {
  var m = base.toUpperCase().match(/^(G2|G3|H2|H3|H4|K3)(?=[\s_]|$)/);
  return m ? m[1] : "";
}

function parseTonRange_(base) {
  var m = base.replace(/,/g, ".").match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*T\b/i);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
}

function parseModel_(model) {
  var s = model.toUpperCase().replace(/\s+/g, "");
  var m = s.match(/^([A-Z]{2,4})(\d{2,3})([A-Z0-9-]*)/);
  if (!m) return null;
  return { prefix: m[1], cap: +m[2], suffix: m[3].replace(/[^A-Z0-9]/g, "") };
}

function longestCommonSubstring_(a, b) {
  var best = 0;
  for (var i = 0; i < a.length; i++) {
    for (var j = 0; j < b.length; j++) {
      var k = 0;
      while (i + k < a.length && j + k < b.length && a.charAt(i + k) === b.charAt(j + k)) k++;
      if (k > best) best = k;
    }
  }
  return best;
}

function suffixSimilarity_(a, b) {
  if (!a && !b) return 30;
  if (!a || !b) return 5;
  if (a === b) return 50;
  if (a.indexOf(b) !== -1 || b.indexOf(a) !== -1) return 40;
  return Math.round(35 * longestCommonSubstring_(a, b) / Math.max(a.length, b.length));
}

function categoryFolderKeys_(type) {
  var t = String(type || "").toUpperCase();
  if (/PALLET/.test(t)) return ["GABELHUBWAGEN"];
  if (/REACH/.test(t)) return ["SCHUBMAST"];
  if (/ORDER PICKER/.test(t)) return ["KOMMISSIONIERER"];
  if (/STACKER|INITIAL LIFT/.test(t)) return ["HOCHHUBWAGEN", "DEICHSEL"];
  if (/3 WHEEL/.test(t)) return ["3-RAD"];
  if (/4 WHEEL/.test(t)) return ["4-RAD"];
  if (/ROUGH|DIESEL|LPG|\bIC\b/.test(t)) return ["DIESEL", "VERBRENNUNG"];
  return [];
}

var IC_PREFIXES = ["CPCD", "CPYD", "CPCJ", "CPQD", "CPQYD"];

// Повертає {url, name, score, method}
function findMatchingPhoto_(photoIndex, rawModel, baseModel, rawType, rawSeries, tonnage) {
  var empty = { url: "", name: "", link: "", score: 0, method: "" };
  if (!photoIndex || !photoIndex.length) return empty;

  var modelClean = rawModel.toUpperCase().replace(/[^A-Z0-9]/g, "");
  var baseClean = baseModel.toUpperCase().replace(/[^A-Z0-9]/g, "");
  var model = parseModel_(rawModel);
  var typeUp = rawType.toUpperCase();
  var seriesUp = rawSeries.toUpperCase();
  var mSeries = (seriesUp.match(/^(G2|G3|H2|H3|H4|K3)/) || [""])[0];
  var mPlus = /PLUS|\+/.test(seriesUp);
  var tons = parseFloat(tonnage) || 0;
  var folderKeys = categoryFolderKeys_(rawType);
  var modelIsIC = /DIESEL|LPG|\bIC\b|ROUGH/.test(typeUp) || (model && IC_PREFIXES.indexOf(model.prefix) !== -1);

  var best = empty;

  for (var p = 0; p < photoIndex.length; p++) {
    var ph = photoIndex[p];
    var score = 0, method = "";

    // 0) ручна прив'язка в колонці Model на вкладці photo
    if (ph.manualModels.length &&
        (ph.manualModels.indexOf(modelClean) !== -1 || ph.manualModels.indexOf(baseClean) !== -1)) {
      score = 1000; method = "manual";
    }
    // 1) точний збіг імені (стара логіка)
    else if (ph.clean === modelClean) { score = 900; method = "exact"; }
    else if (baseClean && ph.clean === baseClean) { score = 800; method = "exact-base"; }
    else {
      var folderHit = folderKeys.some(function (k) { return ph.folder.indexOf(k) !== -1; });
      var folderBonus = folderHit ? 15 : 0;
      var seriesBonus = 0;
      if (mSeries && ph.series) seriesBonus = (mSeries === ph.series) ? 25 : -10;
      if (mPlus && ph.plus) seriesBonus += 5;

      // 2) збіг за "сімейством" моделі (префікс + вантажопідйомність + суфікс)
      var famScore = 0;
      if (model) {
        for (var f = 0; f < ph.families.length; f++) {
          var fam = ph.families[f];
          var penalty = 0;
          if (fam.prefix !== model.prefix) {
            if (IC_PREFIXES.indexOf(fam.prefix) !== -1 && IC_PREFIXES.indexOf(model.prefix) !== -1) penalty = 15;
            else continue;
          }
          if (!fam.caps.length) continue;
          var capScore = 0;
          var mn = Math.min.apply(null, fam.caps), mx = Math.max.apply(null, fam.caps);
          if (fam.caps.indexOf(model.cap) !== -1) capScore = 40;
          else if (fam.caps.length >= 2 && model.cap >= mn && model.cap <= mx) capScore = 30;
          else continue;
          var s = capScore + suffixSimilarity_(model.suffix, fam.suffix) - penalty;
          if (s > famScore) famScore = s;
        }
      }
      if (famScore > 0) {
        score = famScore + folderBonus + seriesBonus;
        method = "family";
      }

      // 3) загальне фото серії: G3_IC_2-3.5t, H4_0.8-1.2t, G3_Rough_Terrian ...
      if (!ph.families.length) {
        var g = 0;
        var sameGroup = folderHit || (ph.isIC && modelIsIC) || !folderKeys.length;
        if (ph.isRough && /ROUGH/.test(typeUp)) g += 80;
        if (sameGroup && ph.series && mSeries === ph.series && ph.tonRange &&
            tons >= ph.tonRange[0] && tons <= ph.tonRange[1]) g += 60;
        if (ph.isIC && modelIsIC) g += 10;
        if (ph.isIC && !modelIsIC) g -= 40;
        if (folderHit && /ORDER PICKER|REACH/.test(typeUp)) g += 45; // вузькі категорії
        if (g > 0) {
          g += folderBonus;
          if (g > score) { score = g; method = "series"; }
        }
      }
    }

    if (score > best.score) {
      best = { url: ph.url, name: ph.name, link: ph.link, score: score, method: method };
    }
  }

  return best.score >= CONFIG.PHOTO_MIN_SCORE ? best : empty;
}

// ==========================================
// 4.1 АВТООНОВЛЕННЯ 2 РАЗИ НА ДЕНЬ
// ==========================================
// Запустіть ОДИН раз вручну: створить тригери на години з CONFIG.UPDATE_HOURS.
// Повторний запуск спочатку видаляє старі тригери — дублів не буде.
function setupDailyTriggers() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === "scheduledUpdate") ScriptApp.deleteTrigger(t);
  });
  CONFIG.UPDATE_HOURS.forEach(function (h) {
    ScriptApp.newTrigger("scheduledUpdate").timeBased().atHour(h).everyDays(1).create();
  });
  Logger.log("Тригери створено на години: " + CONFIG.UPDATE_HOURS.join(", "));
}

// Те, що виконує тригер: оновлення + CSV на Диску
function scheduledUpdate() {
  updateSyncAndNormalize();
  try {
    saveExportToCsvFile();
  } catch (err) {
    Logger.log("CSV не збережено: " + err);
  }
}

// ==========================================
// 5. ШІ-ПІДБІР ФОТО (НЕОБОВ'ЯЗКОВО)
// ==========================================
// Викликається лише для моделей без фото. Результати кешуються на вкладці ai_photo_cache,
// тож кожна модель відправляється в ШІ один раз. Кеш можна правити вручну.
function applyAiPhotoMatches_(targetSS, rows, photoIndex) {
  var cacheSheet = targetSS.getSheetByName(CONFIG.AI_CACHE_SHEET);
  if (!cacheSheet) {
    cacheSheet = targetSS.insertSheet(CONFIG.AI_CACHE_SHEET);
    cacheSheet.appendRow(["Model", "Photo_File", "Checked_At"]);
  }
  var cache = {};
  cacheSheet.getDataRange().getValues().slice(1).forEach(function (r) {
    if (r[0]) cache[String(r[0]).trim()] = String(r[1] || "").trim();
  });

  var byName = {};
  photoIndex.forEach(function (ph) { if (!byName[ph.name]) byName[ph.name] = ph; });

  var toAsk = {};
  rows.forEach(function (r) {
    if (!r["Image_URL"] && cache[r["Full_Model"]] === undefined) toAsk[r["Full_Model"]] = r["Category_Type"] + " / " + r["Series"];
  });

  var models = Object.keys(toAsk);
  if (models.length) {
    var answers = askAiForPhotos_(models, toAsk, Object.keys(byName));
    var now = new Date();
    models.forEach(function (m) {
      var file = answers[m] && byName[answers[m]] ? answers[m] : "-";
      cache[m] = file;
      cacheSheet.appendRow([m, file, now]);
    });
  }

  rows.forEach(function (r) {
    var file = cache[r["Full_Model"]];
    if (!r["Image_URL"] && file && file !== "-" && byName[file]) {
      r["Image_URL"] = byName[file].url;
      r["Photo_Name"] = byName[file].name;
      r["Photo_Link"] = byName[file].link;
      r["Photo_Match"] = "ai: " + file;
    }
  });
}

function askAiForPhotos_(models, info, fileNames) {
  var key = PropertiesService.getScriptProperties().getProperty("ANTHROPIC_API_KEY");
  if (!key) {
    Logger.log("ШІ: не задано ANTHROPIC_API_KEY у Властивостях скрипту — пропускаю.");
    return {};
  }

  var prompt =
    "Ти підбираєш фото техніки HELI (навантажувачі, штабелери, рокли).\n" +
    "Список файлів фото:\n" + fileNames.join("\n") + "\n\n" +
    "Моделі (модель — категорія / серія):\n" +
    models.map(function (m) { return m + " — " + info[m]; }).join("\n") + "\n\n" +
    "Для кожної моделі обери файл, де зображена та сама або дуже схожа модель " +
    "(той самий префікс типу CPD/CBD/CDD/CPCD, вантажопідйомність входить у діапазон з імені файлу, та сама серія G2/G3/H4). " +
    "Якщо відповідного фото немає — null. Відповідай ЛИШЕ JSON-об'єктом без пояснень і без markdown: " +
    "{\"МОДЕЛЬ\": \"ім'я_файлу\" або null}";

  try {
    var resp = UrlFetchApp.fetch("https://api.anthropic.com/v1/messages", {
      method: "post",
      contentType: "application/json",
      headers: { "x-api-key": key, "anthropic-version": "2023-06-01" },
      payload: JSON.stringify({
        model: CONFIG.AI_MODEL,
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      }),
      muteHttpExceptions: true
    });
    if (resp.getResponseCode() !== 200) {
      Logger.log("ШІ: помилка " + resp.getResponseCode() + " " + resp.getContentText());
      return {};
    }
    var data = JSON.parse(resp.getContentText());
    var text = (data.content || []).filter(function (b) { return b.type === "text"; })
      .map(function (b) { return b.text; }).join("");
    text = text.replace(/```json|```/g, "").trim();
    return JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
  } catch (err) {
    Logger.log("ШІ: " + err);
    return {};
  }
}

// ==========================================
// 6. ВЕБ-СЛУЖБА (XML / YML ЕКСПОРТ)
// ==========================================
function doGet(e) {
  var ss = SpreadsheetApp.openById(CONFIG.TARGET_ID);
  var sheet = ss.getSheetByName(CONFIG.EXPORT_SHEET);
  var data = sheet ? sheet.getDataRange().getValues() : [];
  var headers = data.length ? data[0].map(function (h) { return String(h).trim(); }) : [];

  function val(row, name) {
    var i = headers.indexOf(name);
    if (i === -1 || row[i] === null || row[i] === undefined) return "";
    return String(row[i]).trim();
  }
  function x(s) {
    return escapeXml_(String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, " "));
  }

  // Категорії з Category_Type
  var catMap = {}, nextCat = 1;
  for (var i = 1; i < data.length; i++) {
    var c = val(data[i], "Category_Type") || "Інше";
    if (!catMap[c]) catMap[c] = nextCat++;
  }
  if (nextCat === 1) catMap["Інше"] = 1;

  var out = [];
  out.push('<?xml version="1.0" encoding="UTF-8"?>');
  var feedDate = PropertiesService.getScriptProperties().getProperty("LAST_UPDATE") ||
                 Utilities.formatDate(new Date(), CONFIG.TIMEZONE, "yyyy-MM-dd HH:mm");
  out.push('<yml_catalog date="' + feedDate + '">');
  out.push('<shop>');
  out.push('<name>' + x(CONFIG.SHOP_NAME) + '</name>');
  out.push('<company>' + x(CONFIG.SHOP_NAME) + '</company>');
  out.push('<url>' + x(CONFIG.SHOP_URL) + '</url>');
  out.push('<currencies><currency id="EUR" rate="1"/></currencies>');
  out.push('<categories>');
  for (var cat in catMap) out.push('<category id="' + catMap[cat] + '">' + x(cat) + '</category>');
  out.push('</categories>');
  out.push('<offers>');

  var paramFields = {
    "Capacity_kg": "Вантажопідйомність", "Tonnage": "Тоннаж", "Series": "Серія",
    "Engine_Type": "Тип двигуна", "Controller_Engine": "Двигун/контролер",
    "Battery_Type": "Тип АКБ", "Voltage": "Напруга", "Battery_Capacity": "Ємність АКБ",
    "Forks_Dimensions": "Розмір вил", "MAST": "Щогла", "Tyres": "Шини",
    "Attachments": "Навісне обладнання", "Cabin": "Кабіна",
    "Special_Options": "Опції", "Location": "Локація", "ETA": "ETA",
    "Serial_Number": "Серійний номер",
    "Photo_Name": "Фото (назва)", "Photo_Link": "Фото (лінк)"
  };

  var usedIds = {};
  for (var r = 1; r < data.length; r++) {
    var row = data[r];
    var model = val(row, "Full_Model");
    if (!model) continue;

    var id = val(row, "SKU").replace(/[^A-Za-z0-9_-]/g, "_") || ("item_" + r);
    if (usedIds[id]) id += "_" + r;
    usedIds[id] = true;

    var price = parseFloat(val(row, "Price"));
    var cat2 = val(row, "Category_Type") || "Інше";

    out.push('<offer id="' + x(id) + '" available="' + (val(row, "Is_Available") === "true") + '">');
    out.push('<name>' + x("HELI " + model) + '</name>');
    out.push('<vendor>HELI</vendor>');
    out.push('<model>' + x(model) + '</model>');
    out.push('<vendorCode>' + x(val(row, "SKU")) + '</vendorCode>');
    out.push('<price>' + (isNaN(price) ? 0 : price.toFixed(2)) + '</price>');
    out.push('<currencyId>EUR</currencyId>');
    out.push('<categoryId>' + catMap[cat2] + '</categoryId>');
    out.push('<stock_quantity>' + (parseInt(val(row, "Qty"), 10) || 0) + '</stock_quantity>');

    var img = val(row, "Image_URL");
    var photoName = val(row, "Photo_Name");
    var photoLink = val(row, "Photo_Link");
    if (/^https?:\/\//i.test(img)) out.push('<picture>' + x(img) + '</picture>');
    // Фото також окремими тегами — щоб імпортер міг знайти його і за назвою, і за лінком
    if (photoName) out.push('<photo_name>' + x(photoName) + '</photo_name>');
    if (photoLink) out.push('<photo_link>' + x(photoLink) + '</photo_link>');

    for (var field in paramFields) {
      var v = val(row, field);
      if (v) out.push('<param name="' + x(paramFields[field]) + '">' + x(v) + '</param>');
    }
    out.push('</offer>');
  }

  out.push('</offers>');
  out.push('</shop>');
  out.push('</yml_catalog>');

  return ContentService.createTextOutput(out.join("\n")).setMimeType(ContentService.MimeType.XML);
}

function escapeXml_(unsafe) {
  if (unsafe === null || unsafe === undefined) return "";
  return String(unsafe).replace(/[<>&'"]/g, function (c) {
    switch (c) {
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '&': return '&amp;';
      case '\'': return '&apos;';
      case '"': return '&quot;';
      default: return c;
    }
  });
}

// ==========================================
// 7. ЗБЕРЕЖЕННЯ CSV НА GOOGLE ДИСК (З UTF-8 BOM ДЛЯ EXCEL)
// ==========================================
function saveExportToCsvFile() {
  var targetSS = SpreadsheetApp.openById(CONFIG.TARGET_ID);
  var sheet = targetSS.getSheetByName(CONFIG.EXPORT_SHEET);
  if (!sheet) { Logger.log("Помилка: Аркуш " + CONFIG.EXPORT_SHEET + " не знайдено!"); return; }

  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) { Logger.log("Помилка: Немає даних для експорту."); return; }

  var csvRows = data.map(function (r) {
    return r.map(function (cell) {
      var val = String(cell !== null && cell !== undefined ? cell : "");
      if (val.indexOf('"') !== -1) val = val.replace(/"/g, '""');
      if (/[",;\n]/.test(val)) val = '"' + val + '"';
      return val;
    }).join(",");
  });
  var csvContent = "\uFEFF" + csvRows.join("\n");

  var file = DriveApp.getFileById(CONFIG.TARGET_ID);
  var parents = file.getParents();
  var folder = parents.hasNext() ? parents.next() : DriveApp.getRootFolder();

  var csvFileName = "export_products.csv";
  var files = folder.getFilesByName(csvFileName);
  var targetFile;
  if (files.hasNext()) {
    targetFile = files.next();
    targetFile.setContent(csvContent);
    Logger.log("Оновлено існуючий CSV файл!");
  } else {
    targetFile = folder.createFile(csvFileName, csvContent, MimeType.CSV);
    Logger.log("Створено новий CSV файл!");
  }
  Logger.log("📍 ПРЯМИЙ ЛІНК НА CSV: " + targetFile.getUrl());
}
