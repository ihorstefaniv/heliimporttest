name: Webforensik Scan
# Раз на 15 хв: перший домен з webforensik/queue.txt -> webforensik.de; результат у results.tsv + reports/json/<id>.json
on:
  # schedule вимкнено 10.11 (сканує Claude локально); увімкнути: розкоментувати 2 рядки
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: webforensik-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Scan next domain
        working-directory: webforensik
        run: node scan.js
      - name: Commit and push
        run: |
          git config --local user.name "webforensik-scan"
          git config --local user.email "action@github.com"
          git add webforensik
          git diff --staged --quiet && { echo "без змін"; exit 0; }
          git commit -m "webforensik scan $(date -u +%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
