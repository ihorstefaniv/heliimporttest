<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HELI Alt vs Neu</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --accent: #f7b500; --accent-ink: #1d1d1b; --ok: #2e7d32; --bad: #c62828; --chip: #fff4cc;
  --old: #eef1f5; --new: #fff4cc; --diff: #ffe08a;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #20201d; --ink: #f1efe8; --muted: #a3a197; --line: #34332e;
    --accent: #f7b500; --accent-ink: #161614; --ok: #66bb6a; --bad: #ef5350; --chip: #3a3215;
    --old: #262a30; --new: #3a3215; --diff: #5a4710;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #20201d; --ink: #f1efe8; --muted: #a3a197; --line: #34332e;
  --accent: #f7b500; --accent-ink: #161614; --ok: #66bb6a; --bad: #ef5350; --chip: #3a3215;
  --old: #262a30; --new: #3a3215; --diff: #5a4710;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; }
h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: var(--surface); color: var(--ink); padding: 8px 14px; font: inherit; cursor: pointer; }
.lang button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.code { font-family: var(--mono); font-weight: 700; }
.muted { color: var(--muted); }
.warn { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 26px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.col { border-radius: 10px; padding: 16px; border: 1px solid var(--line); }
.col.old { background: var(--old); }
.col.new { background: var(--new); }
.col ul { margin: 8px 0 0; padding-left: 20px; }
.col li { margin-bottom: 6px; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; font-family: var(--mono); font-size: 20px; }
.part { padding: 6px 10px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); text-align: center; }
.part small { display: block; font: 11px system-ui, sans-serif; color: var(--muted); max-width: 150px; }
.part.plain { background: transparent; }
.arrow { align-self: center; font-size: 22px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; background: var(--surface); }
tr.grp td { background: var(--old); border-top: 2px solid var(--line); }
td.diff { background: var(--diff); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); margin: 2px 4px 2px 0; white-space: nowrap; }
.badge.split { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge.warn2 { color: var(--bad); border-color: var(--bad); }
.scroll { overflow-x: auto; max-height: 80vh; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
input[type=search] { flex: 1 1 260px; padding: 10px 12px; font: 15px var(--mono); border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input[type=search]:focus { outline: none; border-color: var(--accent); }
label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.ex { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.shots { display: grid; gap: 20px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair.three { grid-template-columns: 1fr 1fr 1fr; }
figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
figcaption { padding: 8px 12px; font-size: 13px; }
figcaption b { display: block; }
figure.old figcaption { background: var(--old); }
figure.new figcaption { background: var(--new); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; cursor: zoom-out; }
.lightbox.on { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
@media (max-width: 720px) {
  .pair, .pair.three { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>HELI: <span data-t="title"></span> <small data-t="sub"></small></h1>
    <div class="lang"><button data-l="uk">UA</button><button data-l="de">DE</button></div>
  </header>

  <section>
    <h2 data-t="sumTitle"></h2>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2 data-t="logicTitle"></h2>
    <div class="cols">
      <div class="col old"><h3 data-t="oldHead"></h3><div id="oldLogic"></div></div>
      <div class="col new"><h3 data-t="newHead"></h3><div id="newLogic"></div></div>
    </div>
  </section>

  <section>
    <h2 data-t="shotTitle"></h2>
    <p class="muted" data-t="shotNote"></p>
    <div class="shots" id="shots"></div>
  </section>

  <section>
    <h2 data-t="decTitle"></h2>
    <div id="decode"></div>
  </section>

  <section>
    <h2 data-t="exTitle"></h2>
    <div id="example"></div>
  </section>

  <section>
    <h2 data-t="tabTitle"></h2>
    <p class="muted" data-t="tabNote"></p>
    <div class="meta">
      <input type="search" id="f">
      <label class="chk"><input type="checkbox" id="onlySplit"> <span data-t="onlySplit"></span></label>
      <span id="count"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th data-t="thOld"></th><th data-t="thNew"></th><th data-t="thModel"></th><th data-t="thMast"></th>
        <th data-t="thBat"></th><th class="hide-sm" data-t="thExtra"></th><th data-t="thUnits"></th><th class="hide-sm" data-t="thSrc"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <details>
      <summary data-t="noSrcTitle"></summary>
      <p class="muted" data-t="noSrcNote"></p>
      <div id="noSrc"></div>
    </details>
  </section>

  <section>
    <details>
      <summary id="emptyTitle"></summary>
      <p class="muted" data-t="emptyNote"></p>
      <p id="empty" class="ex"></p>
    </details>
  </section>

  <p class="warn" data-t="warn"></p>
</div>
<div class="lightbox" id="lb"><img alt=""></div>

    noSrcNote: "У каталозі 2100 немає картки, з якої взяти фото й текст. Коди видано; щойно з'явиться картка — потраплять у тест автоматично.",

  de: {

    ],

    oldLogic: `<ul>
<li>Name = Werksmodell: <span class="code">4-Rad Elektrostapler CPD25-GB2Li-M/GB3Li-M</span>. Wettbewerber sehen das genaue Modell und vergleichen Preise.</li>
<li>Eine Karte deckt <b>viele Geräte</b> ab: unterschiedliche Masten, Batterien, Reifen, Anbaugeräte – im Namen nicht sichtbar.</li>

<li>Eine Karte = <b>eine Ausstattung</b>: Modell + Mast + Batterie (+ 2 Zeichen, wenn dieselbe Ausstattung andere Reifen / Anbaugeräte / Kabine / Gabeln / Optionen hat).</li>
<li>Kombinierte Karten werden aufgeteilt: jedes Modell und jede Ausstattung bekommt eine eigene Karte.</li>
<li>Beschreibung: kurze Zusammenfassung genau dieses Geräts (Tragfähigkeit, Hubhöhe, Batterie, Reifen …) + allgemeine Vorteile der Baureihe.</li>
<li>Nur Lagerware: Preis = günstigstes Gerät der Variante im Shop, Button „Zum Shop“ und weitere Varianten der Familie unter Codes.</li>

    newNote: "Der neue Code ist geschlossen: die Zeichen sind zufällig und nur über das Verzeichnis lesbar (Tabs model_codes und code_tokens, lokale Seite heli-codes-slovnyk.html). Gleiche Ausstattung ergibt immer denselben Code; ein vergebener Code ändert sich nie. Jede Familie hat eigene Zeichen.",

    onlySplit: "nur Aufteilungen (1 alte → mehrere neue)",

    emptyTitle: n => "Alte Karten ohne Geräte im Shop (" + n + ") – im neuen Katalog nicht enthalten",
    emptyNote: "Der neue Katalog zeigt nur Lagerware. Sobald ein Gerät dieses Modells im Shop ist, vergibt der Generator einen Code und legt die Karte an.",
    li: "Li-Ion", pb: "Blei", mm: "mm",
    warn: "⚠️ Internes Dokument: enthält die Zuordnung der Codes zu den Werksmodellen. Nicht veröffentlichen oder weitergeben. Aktualisieren: Tabelle exportieren (names_report, model_codes) und build-old-vs-new-html.js ausführen."

let lang = "de";
try { lang = localStorage.getItem("heliOldNewLang") || "de"; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const norm = s => String(s || "").toUpperCase().replace(/\s+/g, "");
const num = n => Number(n).toLocaleString("de-DE");
const newUrl = c => SITE + "test-heli-codes/" + ("Heli " + c.n).split(" ").map(encodeURIComponent).join("+") + "-" + c.id;
const oldUrl = o => o.page ? SITE + o.page + "/Heli-" + o.id : "";

function mast(c) {
  const x = String(c.h || "").match(/(\d+)/);
  return c.h ? esc(c.h) + (x ? ' <span class="ex">' + num(Number(x[1]) * 10) + " " + T[lang].mm + "</span>" : "") : "—";
}
function bat(c) {
  if (!c.v && !c.a) return /li/i.test(c.b) ? T[lang].li : "—";
  return (c.v ? c.v + " V" : "") + (c.a ? " / " + c.a + " Ah" : "") + " · " + (/li/i.test(c.b) ? T[lang].li : T[lang].pb);
}
const xs = c => String(c.x || "").split("|");
const fullExtras = c => xs(c).map((v, i) => v ? T[lang].exLabels[i] + ": " + v : "").filter(Boolean).join("\n");
// комплектація: лише поля, якими картка відрізняється від більшості карток цієї старої (повна — у підказці)
function extras(c, mode) {
  const L = T[lang].exLabels;
  const list = xs(c).map((v, i) => v !== (mode.x[i] || "") ? "<b>" + L[i] + ":</b> " + esc(v.length > 110 ? v.slice(0, 110) + "…" : v || "—") : "").filter(Boolean);
  return '<span title="' + esc(fullExtras(c)) + '">' + (list.length ? list.join("<br>") : '<span class="muted">' + T[lang].same + "</span>") + "</span>";
}
// найчастіше значення кожного поля серед нових карток однієї старої; відмінне від нього — підсвічуємо
const KEYS = { m: c => c.m, h: c => c.h, b: c => c.v + "/" + c.a + "/" + c.b };
function modeOf(list) {
  const top = vals => { const n = {}; vals.forEach(v => { n[v] = (n[v] || 0) + 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a])[0]; };
  const out = { x: [] };
  Object.keys(KEYS).forEach(k => { out[k] = top(list.map(KEYS[k])); });
  for (let i = 0; i < 6; i++) out.x[i] = top(list.map(c => xs(c)[i] || ""));
  return out;
}
const isDiff = (mode, k, c) => mode.n > 1 && KEYS[k](c) !== mode[k];
function badges(o) {
  const t = T[lang];
  return (o.cards.length > 1 ? '<span class="badge split">' + t.toN(o.cards.length) + "</span>" : "") +
    (o.combined ? '<span class="badge">' + t.combined + "</span>" : "") +
    (o.page ? "" : '<span class="badge warn2">' + t.noLink + "</span>");
}
function oldCell(o) {
  const u = oldUrl(o);
  return (u ? '<a href="' + u + '" target="_blank" rel="noopener"><b>' + esc(o.name) + "</b></a>" : "<b>" + esc(o.name) + "</b>") +
    ' <span class="ex">#' + esc(o.id) + "</span><br>" + badges(o);
}
// спільні клітинки нової картки: модель, щогла, батарея, комплектація
function cells(c, mode) {
  const xd = mode.n > 1 && xs(c).some((v, i) => v !== (mode.x[i] || ""));
  return '<td class="code' + (isDiff(mode, "m", c) ? " diff" : "") + '">' + esc(c.m) + "</td>" +
    "<td" + (isDiff(mode, "h", c) ? ' class="diff"' : "") + ">" + mast(c) + "</td>" +
    "<td" + (isDiff(mode, "b", c) ? ' class="diff"' : "") + ">" + esc(bat(c)) + "</td>" +
    '<td class="hide-sm ex' + (xd ? " diff" : "") + '">' + (mode.n > 1 ? extras(c, mode) : extras(c, { x: [] })) + "</td>";
}
function newLink(c) {
  return '<a class="code" href="' + newUrl(c) + '" target="_blank" rel="noopener">' + esc(c.c) + "</a>" +
    (c.c.split("-")[1].length > 5 ? '<br><span class="badge">' + T[lang].variant + "</span>" : "");
}
function newRow(o, c, mode) {
  const t = T[lang];
  const own = o.models.length > 1 && !o.models.some(m => norm(c.m).indexOf(norm(m)) === 0);
  return "<tr>" +
    '<td class="ex">' + (own ? esc(t.other) : "") + "</td>" +
    "<td>" + newLink(c) + "</td>" + cells(c, mode) +
    "<td>" + esc(c.u) + "</td>" +
    '<td class="hide-sm ex">' + esc(t.match[c.mt] || c.mt) + "</td></tr>";
}

function renderTable() {
  const q = norm($("#f").value), onlySplit = $("#onlySplit").checked;
  let shown = 0;
  const html = OLD.filter(o => !onlySplit || o.cards.length > 1).map(o => {
    const hitOld = !q || norm(o.name + o.id + o.model).includes(q);
    const cards = o.cards.filter(c => hitOld || [c.c, c.m, c.h, c.x, c.v + "/" + c.a].some(v => norm(v).includes(q)));
    if (!cards.length) return "";
    shown += cards.length;
    const mode = Object.assign(modeOf(o.cards), { n: o.cards.length });
    return '<tr class="grp"><td colspan="8">' + oldCell(o) + "</td></tr>" + cards.map(c => newRow(o, c, mode)).join("");
  }).join("");
  $("#rows").innerHTML = html;
  $("#count").textContent = T[lang].cnt(shown, STATS.newCards);
}

function renderExample() {
  const t = T[lang];
  const o = OLD.find(x => x.id === EXAMPLE) || OLD[0];
  const mode = Object.assign(modeOf(o.cards), { n: o.cards.length });
  $("#example").innerHTML = "<p>" + t.exNote(esc(o.name), o.cards.length) + "</p>" +
    '<div class="scroll" style="max-height:none"><table><thead><tr><th>' + t.thNew + "</th><th>" + t.thModel + "</th><th>" + t.thMast +
    "</th><th>" + t.thBat + '</th><th class="hide-sm">' + t.thExtraDiff + "</th></tr></thead><tbody>" +
    o.cards.slice(0, 10).map(c => "<tr><td>" + newLink(c) + "</td>" + cells(c, mode) + "</tr>").join("") +
    "</tbody></table></div>" + (o.cards.length > 10 ? '<p class="ex">… +' + (o.cards.length - 10) + " · " + t.seeTable + "</p>" : "");
}

function renderShots() {
  const t = T[lang];
  $("#shots").innerHTML = SHOTS.map(g => "<div><h3>" + esc(t.shots[g.key]) + '</h3><div class="pair' + (g.items.length > 2 ? " three" : "") + '">' +
    g.items.map(i => '<figure class="' + (i.kind === "old" ? "old" : "new") + '"><img src="' + i.src + '" alt="' + esc(i.title) + '" loading="lazy">' +
      "<figcaption><b>" + esc(t.shotLbl[i.kind]) + '</b><a href="' + i.url + '" target="_blank" rel="noopener">' + esc(i.title) + "</a></figcaption></figure>").join("") +
    "</div></div>").join("");
}

function parts(list) {
  return '<div class="parts">' + list.map(p => '<div class="part' + (p[0].length > 4 ? " plain" : "") + '">' + esc(p[0]) + "<small>" + esc(p[1]) + "</small></div>").join("") + "</div>";
}

function apply() {
  const t = T[lang];
  document.documentElement.lang = lang === "uk" ? "uk" : "de";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  $("#stats").innerHTML = t.st.map(s => '<div class="stat"><b>' + STATS[s[0]] + "</b><span>" + s[1] + "</span></div>").join("");
  $("#oldLogic").innerHTML = t.oldLogic;
  $("#newLogic").innerHTML = t.newLogic;
  $("#decode").innerHTML =
    '<div class="cols"><div class="col old"><h3>' + t.oldHead + '</h3><div class="code">CPD25-GB2Li-M/GB3Li-M</div>' + parts(t.oldParts) + '<p class="ex">' + t.oldNote + "</p></div>" +
    '<div class="col new"><h3>' + t.newHead + '</h3><div class="code">CPD25-KHST4DM</div>' + parts(t.newParts) + '<p class="ex">' + t.newNote + "</p></div></div>";
  renderShots();
  renderExample();
  $("#f").placeholder = t.filt;
  $("#legend").innerHTML = t.legend.map(l => '<span><i style="background:var(' + l[0] + ')"></i>' + l[1] + "</span>").join("");
  $("#noSrc").innerHTML = NOSRC.length ? "<table><tbody>" + NOSRC.map(c => '<tr><td class="code">' + esc(c.c) + '</td><td class="code">' + esc(c.m) +
    "</td><td>" + mast(c) + "</td><td>" + esc(bat(c)) + "</td><td>" + esc(c.u) + "</td></tr>").join("") + "</tbody></table>" : "—";
  $("#emptyTitle").textContent = t.emptyTitle(EMPTY.length);
  $("#empty").textContent = EMPTY.map(e => e[1] + " #" + e[0]).join(" · ");
  renderTable();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("heliOldNewLang", lang); } catch (e) {}
  apply();
}));
$("#f").addEventListener("input", renderTable);
$("#onlySplit").addEventListener("change", renderTable);
document.addEventListener("click", e => {
  const lb = $("#lb");
  if (e.target.matches("figure img")) { lb.querySelector("img").src = e.target.src; lb.classList.add("on"); }
  else if (e.target.closest("#lb")) lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").classList.remove("on"); });
apply();
</script>
</body>
</html>
