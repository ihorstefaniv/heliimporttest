<title>HELI Codes</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
  --accent: #f7b500; --accent-ink: #1d1d1b; --ok: #2e7d32; --bad: #c62828; --chip: #fff4cc;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #20201d; --ink: #f1efe8; --muted: #a3a197; --line: #34332e;
    --accent: #f7b500; --accent-ink: #161614; --ok: #66bb6a; --bad: #ef5350; --chip: #3a3215;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #20201d; --ink: #f1efe8; --muted: #a3a197; --line: #34332e;
  --accent: #f7b500; --accent-ink: #161614; --ok: #66bb6a; --bad: #ef5350; --chip: #3a3215;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; }
h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
h2 { font-size: 18px; margin: 0 0 12px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: var(--surface); color: var(--ink); padding: 8px 14px; font: inherit; cursor: pointer; }
.lang button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.warn { font-size: 13px; color: var(--muted); }
input[type=search] { width: 100%; padding: 12px 14px; font: 16px var(--mono); border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input[type=search]:focus { outline: none; border-color: var(--accent); }
.code { font-family: var(--mono); font-weight: 700; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; font-family: var(--mono); font-size: 22px; }
.part { padding: 6px 10px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); text-align: center; }
.part small { display: block; font: 11px system-ui, sans-serif; color: var(--muted); }
.part.fam { background: transparent; }
dl.res { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.res dt { color: var(--muted); }
dl.res dd { margin: 0; word-break: break-word; }
.ok { color: var(--ok); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.steps { padding-left: 20px; margin: 0; }
.steps li { margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--chip); }
.scroll { overflow-x: auto; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.meta input { flex: 1 1 240px; }
details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.toks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.tokfam { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.tokfam b { font-family: var(--mono); }
.tokfam div { display: flex; gap: 8px; }
.tokfam span:first-child { font-family: var(--mono); font-weight: 700; min-width: 34px; }
.muted { color: var(--muted); }
@media (max-width: 640px) {
  .hide-sm { display: none; }
  dl.res { grid-template-columns: 1fr; gap: 2px; }
  dl.res dd { margin-bottom: 8px; }
}
</style>
</head>

    warn: "⚠️ Internes Dokument: enthält die Zuordnung der Codes zu den Werksmodellen. Nicht veröffentlichen oder weitergeben. Aktualisieren: Tabelle neu exportieren und build-codes-html.js ausführen.",
    cnt: (a, b) => a + " von " + b
  }
};

let lang = "uk";
try { lang = localStorage.getItem("heliCodesLang") || "uk"; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const norm = s => String(s || "").toUpperCase().replace(/\s+/g, "");
const num = n => Number(n).toLocaleString("de-DE");

// той самий алгоритм, що namesCheck_ у Names.gs
function check(family, code) {
  let sum = 0; const s = family + code;
  for (let i = 0; i < s.length; i++) sum = (sum * 31 + s.charCodeAt(i)) % 9973;
  const letters = ALPHABET.replace(/\d/g, ""), digits = ALPHABET.replace(/\D/g, "");
  if (!/\d/.test(code)) return digits.charAt(sum % digits.length);
  if (!/[A-Z]/.test(code)) return letters.charAt(sum % letters.length);
  return ALPHABET.charAt(sum % ALPHABET.length);
}
const tok = (table, family, token) => TOKENS.find(r => r[0] === table && r[1] === family && r[3] === token);

function mastText(m) {
  const x = String(m || "").toUpperCase().match(/^(ZSM|ZM|M)(\d+)/);
  if (!x) return m || "—";
  return m + " · " + num(Number(x[2]) * 10) + " mm · " + T[lang].mastT[x[1]];
}
function batText(v, a, b) {
  if (!v && !a) return "—";
  const li = /li/i.test(b);
  return (v ? v + " V" : "") + (a ? " / " + a + " Ah" : "") + " · " + (li ? T[lang].li : T[lang].pb);
}
function extrasText(x) {
  const L = T[lang].exLabels;
  return String(x || "").split("|").map((v, i) => v ? "<b>" + L[i] + ":</b> " + esc(v) : "").filter(Boolean).join("<br>") || "—";
}

function decode(input) {
  const t = T[lang];
  const q = norm(input);
  if (!q) return "";
  const m = q.match(/([A-Z0-9()]+)-([A-Z2-9]{5}(?:[A-Z2-9]{2})?)$/);
  let html = "";

  if (m) {
    // з повної назви («Heli 4-Rad Elektrostapler CPD18-…») беремо найдовшу відому родину в кінці префікса
    const fam = FAMILIES.find(f => m[1].endsWith(f)) || m[1], body = m[2], base = body.slice(0, 5);
    const row = CODES.find(r => r.c === fam + "-" + body);
    const tm = tok("M", fam, body[0]), th = tok("H", fam, body[1]), tb = tok("B", fam, body.slice(2, 4));
    const tx = body.length > 5 ? tok("X", fam + "-" + base, body.slice(5)) : null;
    const exp = check(fam, body.slice(0, 4));
    const part = (v, lbl, cls) => '<div class="part ' + (cls || "") + '">' + esc(v) + "<small>" + lbl + "</small></div>";
    html += '<div class="parts">' + part(fam, t.family, "fam") + part(body[0], t.mod) + part(body[1], t.mast) +
      part(body.slice(2, 4), t.bat) + part(body[4], t.check) + (body.length > 5 ? part(body.slice(5), t.extra) : "") + "</div>";
    const known = tm || th || tb;
    if (known) {
      html += "<p class=\"" + (exp === body[4] ? "ok" : "bad") + "\">" + (exp === body[4] ? t.checkOk : t.checkBad(exp)) + "</p>";
      html += '<dl class="res">' +
        "<dt>" + t.mod + " (" + body[0] + ")</dt><dd>" + (tm ? '<span class="code">' + esc(fam + "-" + tm[2]) + "</span>" : t.unknown) + "</dd>" +
        "<dt>" + t.mast + " (" + body[1] + ")</dt><dd>" + (th ? esc(mastText(th[2] === "-" ? "" : th[2])) : t.unknown) + "</dd>" +
        "<dt>" + t.bat + " (" + body.slice(2, 4) + ")</dt><dd>" + (tb ? esc(batText.apply(null, tb[2].split("/"))) : t.unknown) + "</dd>" +
        (body.length > 5 ? "<dt>" + t.extra + " (" + body.slice(5) + ")</dt><dd>" + (tx ? extrasText(tx[2]) : t.unknown) + "</dd>" : "") +
        "</dl>";
    }
    if (row) html += "<hr style=\"border:0;border-top:1px solid var(--line);margin:16px 0\">" + rowCard(row);
    if (known || row) return html;
  }

  // зворотний пошук: заводська модель / reference number / частина коду
  const hits = CODES.filter(r => norm(r.m) === q).length
    ? CODES.filter(r => norm(r.m) === q)
    : CODES.filter(r => norm(r.c).includes(q) || norm(r.m).includes(q) || norm(r.r).includes(q));
  if (!hits.length) return "<p>" + t.notFound + "</p>";
  return "<p>" + t.byModel(hits.length) + "</p>" + hits.slice(0, 12).map(r =>
    '<p><a href="#" data-code="' + esc(r.c) + '" class="code">' + esc(r.c) + "</a> · " + esc(r.m) + " · " +
    esc(r.h || "—") + " · " + esc(batText(r.v, r.a, r.b)) + "</p>").join("");
}

function rowCard(r) {
  const t = T[lang];
  return '<dl class="res">' +
    "<dt>" + t.name + "</dt><dd>Heli " + esc(r.n) + "</dd>" +
    "<dt>" + t.model + '</dt><dd class="code">' + esc(r.m) + "</dd>" +
    "<dt>" + t.lift + "</dt><dd>" + esc(mastText(r.h)) + "</dd>" +
    "<dt>" + t.battery + "</dt><dd>" + esc(batText(r.v, r.a, r.b)) + "</dd>" +
    "<dt>" + t.ext + "</dt><dd>" + extrasText(r.x) + "</dd>" +
    "<dt>" + t.units + "</dt><dd>" + esc(r.u) + "</dd>" +
    "<dt>" + t.refs + "</dt><dd>" + esc(r.r) + "</dd>" +
    "<dt>" + t.card + "</dt><dd>" + (r.id ? '<a href="https://elektrostapler.online/test-heli-codes/Heli-' + esc(r.id) + '" target="_blank" rel="noopener">' + esc(r.id) + "</a>" : t.noCard) + "</dd>" +
    "<dt>" + t.first + "</dt><dd>" + esc(r.s) + "</dd></dl>";
}

function renderTable() {
  const q = norm($("#f").value);
  const list = CODES.filter(r => !q || [r.c, r.m, r.h, r.r, r.n, r.v + "/" + r.a].some(v => norm(v).includes(q)));
  $("#rows").innerHTML = list.map(r =>
    '<tr data-code="' + esc(r.c) + '"><td class="code">' + esc(r.c) + '</td><td class="code">' + esc(r.m) + "</td><td>" +
    esc(r.h || "—") + "</td><td>" + esc(r.v ? r.v + "/" + r.a + " " + (/li/i.test(r.b) ? "Li" : "Pb") : "—") + "</td><td>" + esc(r.u) +
    '</td><td class="hide-sm">' + esc(r.n.replace(/ \S+$/, "")) + '</td><td class="hide-sm">' + esc(r.id || "") + "</td></tr>").join("");
  $("#count").textContent = T[lang].cnt(list.length, CODES.length);
}

function renderTokens() {
  const fams = {};
  TOKENS.filter(r => r[0] !== "X").forEach(r => { (fams[r[1]] = fams[r[1]] || []).push(r); });
  $("#toks").innerHTML = Object.keys(fams).sort().map(f =>
    '<div class="tokfam"><b>' + esc(f) + "</b>" + fams[f].map(r =>
      "<div><span>" + r[0] + " " + esc(r[3]) + "</span><span>" +
      esc(r[0] === "H" ? (r[2] === "-" ? "—" : mastText(r[2])) : r[0] === "B" ? batText.apply(null, r[2].split("/")) : f + "-" + r[2]) +
      "</span></div>").join("") + "</div>").join("");
}

function apply() {
  const t = T[lang];
  document.documentElement.lang = lang === "uk" ? "uk" : "de";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  $("#how").innerHTML = t.how;
  $("#q").placeholder = t.ph;
  $("#f").placeholder = t.filt;
  $("#result").innerHTML = decode($("#q").value);
  renderTable();
  renderTokens();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("heliCodesLang", lang); } catch (e) {}
  apply();
}));
$("#q").addEventListener("input", () => { $("#result").innerHTML = decode($("#q").value); });
$("#f").addEventListener("input", renderTable);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-code]");
  if (!el) return;
  e.preventDefault();
  $("#q").value = el.dataset.code;
  $("#result").innerHTML = decode(el.dataset.code);
  $("#q").scrollIntoView({ behavior: "smooth", block: "center" });
});
$("#q").value = "CPD18-2TEF8ST";
apply();
</script>
</body>
</html>
